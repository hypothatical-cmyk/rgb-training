<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChromaShift 레슨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 폰 폭 한 칼럼 앱. 배경은 색 판단을 흐리지 않도록 포토샵 작업창 같은 완전 중립 회색. */
:root{
  --bg:#2b2b2b;          /* 중립 회색 (R=G=B) */
  --panel:#363636;
  --line:#474747;
  --ink:#ececec;
  --muted:#a3a3a3;
  --accent:#4ea4ff;
  --ok:#3fcf7d;
  --bad:#ff5d61;
  --r:#ff4f4f; --g:#37d67a; --b:#4d8dff;
  --display:"IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:0 16px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}

/* 상단 상태바 */
.top{display:flex;align-items:center;gap:14px;padding:16px 0 12px;position:sticky;top:0;background:var(--bg);z-index:5}
.brand{font-weight:700;letter-spacing:-.01em;flex:1;display:flex;align-items:center;gap:8px}
.brand i{display:inline-flex;gap:2px}
.brand i b{width:7px;height:16px;border-radius:2px;display:block}
.stat{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-weight:600;font-size:15px}
.flame{width:14px;height:18px;background:#ff9b3d;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;display:inline-block}
.flame.off{background:#5a5a5a}
.gem{width:14px;height:14px;background:var(--accent);transform:rotate(45deg);border-radius:3px;display:inline-block}

/* 오늘 목표 */
.goal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.goal .bar{grid-column:1/-1;height:10px;background:#242424;border-radius:99px;overflow:hidden}
.goal .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--r),var(--g),var(--b));border-radius:99px;transition:width .4s}
.goal small{color:var(--muted)}
.practice{background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:14px}
.practice:disabled{opacity:.4;cursor:default}

/* 학습 경로 */
.unit{margin-top:26px}
.unit-head{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);background:var(--panel);position:relative;overflow:hidden}
.unit-head::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--uc)}
.unit-head small{color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.04em}
.unit-head h2{font-size:18px}
.unit-head p{margin:0;color:var(--muted);font-size:14px}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px 0 6px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.node{width:68px;height:62px;border-radius:50%;border:none;background:#4a4a4a;box-shadow:0 6px 0 #393939;display:grid;place-items:center;transition:transform .08s}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 #393939}
.node svg{width:28px;height:28px}
.node.done{background:var(--uc);box-shadow:0 6px 0 color-mix(in srgb,var(--uc) 60%,#000)}
.node.current{background:var(--uc);box-shadow:0 6px 0 color-mix(in srgb,var(--uc) 60%,#000),0 0 0 6px color-mix(in srgb,var(--uc) 30%,transparent)}
.node.locked{cursor:not-allowed}
.node-label{font-size:13px;color:var(--muted);text-align:center;max-width:140px;line-height:1.3}
.node-wrap.current .node-label{color:var(--ink);font-weight:500}
.bubble{position:absolute;top:-38px;background:var(--ink);color:#222;font-weight:700;font-size:13px;padding:4px 10px;border-radius:8px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--ink)}
@keyframes bob{50%{transform:translateY(-4px)}}
.foot{color:var(--muted);font-size:13px;text-align:center;padding:30px 0 40px}

/* 레슨 화면 */
.lesson{display:flex;flex-direction:column;min-height:100%;padding-bottom:16px}
.lhead{display:flex;align-items:center;gap:14px;padding:16px 0}
.x{background:none;border:none;font-size:26px;line-height:1;color:var(--muted);padding:2px 6px}
.prog{flex:1;height:14px;background:#232323;border-radius:99px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .35s}
.qbody{flex:1;display:flex;flex-direction:column;gap:18px;padding-top:6px}
.tag{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.06em}
.prompt{font-size:20px;font-weight:700;line-height:1.4}
.retry{font-size:12px;color:#ffb35c;font-family:var(--mono)}
.visual{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}

.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;background:#232323;font-family:var(--mono);font-weight:600}
.chip i{width:10px;height:10px;border-radius:2px;display:block}
.info{background:#1f1f1f;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-family:var(--mono);font-size:14px;display:grid;grid-template-columns:auto auto;gap:2px 14px}
.info .h{grid-column:1/-1;color:var(--muted);font-size:11px;letter-spacing:.06em;margin-bottom:2px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sw div{width:84px;height:84px;border-radius:12px;border:1px solid rgba(255,255,255,.08)}
.sw b{color:var(--ink);font-family:var(--mono);font-weight:600;font-size:13px}
.op{font-family:var(--mono);color:var(--muted);font-size:14px;text-align:center}
.op b{display:block;color:var(--ink);font-size:15px}
.cv{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.cv canvas{border-radius:8px;display:block;max-width:100%;height:auto}

.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opts.grid{grid-template-columns:1fr 1fr}
.opt{background:var(--panel);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:13px 14px;text-align:left;display:flex;align-items:center;gap:12px;font-size:16px}
.opt .k{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.opt .s{width:44px;height:44px;border-radius:9px;flex:none;border:1px solid rgba(255,255,255,.1)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--panel))}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--panel))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--panel))}
.opt:disabled{cursor:default}

/* 채널 스위치 문제 */
.mixer{display:grid;gap:10px}
.mix-row{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center}
.mix-row>b{font-family:var(--mono);font-size:15px}
.lv{display:flex;gap:6px}
.lv button{flex:1;padding:10px 0;border-radius:10px;border:2px solid var(--line);background:var(--panel);font-family:var(--mono);font-weight:600}
.lv button.on{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 28%,var(--panel))}
.lv button:disabled{cursor:default}

/* 하단 체크/피드백 */
.dock{position:sticky;bottom:0;padding:14px 0 6px;background:var(--bg)}
.cta{width:100%;border:none;border-radius:14px;padding:15px;font-weight:700;font-size:17px;background:var(--accent);color:#08213a;box-shadow:0 4px 0 #2b6fb3}
.cta:disabled{background:#4a4a4a;color:#8a8a8a;box-shadow:0 4px 0 #3a3a3a;cursor:default}
.cta.ok{background:var(--ok);color:#06301a;box-shadow:0 4px 0 #278a51}
.cta.bad{background:var(--bad);color:#3a0607;box-shadow:0 4px 0 #b13a3d}
.fb{border-radius:14px 14px 0 0;margin:0 -16px;padding:16px 16px 4px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:color-mix(in srgb,var(--ok) 15%,var(--bg))}
.fb.bad{background:color-mix(in srgb,var(--bad) 13%,var(--bg))}
.fb h3{font-size:18px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.fb p{margin:0;font-size:15px;color:#dcdcdc}
.fb .ans{font-weight:700;color:var(--ink)}
.fb .after{display:flex;gap:10px;justify-content:center}
.formula{font-family:var(--mono);font-size:13.5px;background:#1f1f1f;border-radius:8px;padding:6px 10px;color:#e8e8e8;display:inline-block}

/* 규칙 카드 */
.rule{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.rule h3{font-size:19px}
.rule ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.rule .formula{font-size:14px}
.rule .neutral{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.rule .neutral i{width:22px;height:22px;border-radius:6px;border:1px solid rgba(255,255,255,.2);display:block}

/* 결과 */
.done-screen{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;text-align:center;padding:30px 0}
.done-screen h2{font-size:26px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tile{border:2px solid var(--line);border-radius:14px;padding:10px 6px}
.tile small{display:block;font-size:12px;color:var(--muted)}
.tile b{font-family:var(--mono);font-size:22px}
.rgbburst{display:flex;gap:6px}
.rgbburst span{width:22px;height:70px;border-radius:6px;animation:grow .6s ease-out both}
.rgbburst span:nth-child(2){animation-delay:.08s}.rgbburst span:nth-child(3){animation-delay:.16s}
@keyframes grow{from{transform:scaleY(.2)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:400px){.opts.grid{grid-template-columns:1fr}.sw div{width:70px;height:70px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
"use strict";
/* ---------- 유틸 ---------- */
const C=v=>Math.max(0,Math.min(255,Math.round(v)));
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const R5=(a,b)=>Math.round(R(a,b)/5)*5;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
const css=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
const g3=v=>[v,v,v];
const CH=['R','G','B'], CHC=['var(--r)','var(--g)','var(--b)'], CHN=['Red','Green','Blue'];

/* ---------- 블렌딩 수학 (0..1 채널) ---------- */
const sep={
  normal:(a,b)=>b,
  multiply:(a,b)=>a*b,
  screen:(a,b)=>1-(1-a)*(1-b),
  darken:Math.min, lighten:Math.max,
  colorBurn:(a,b)=>a>=1?1:b<=0?0:Math.max(0,1-(1-a)/b),
  linearBurn:(a,b)=>Math.max(0,a+b-1),
  colorDodge:(a,b)=>a<=0?0:b>=1?1:Math.min(1,a/(1-b)),
  linearDodge:(a,b)=>Math.min(1,a+b),
  overlay:(a,b)=>a<=.5?2*a*b:1-2*(1-a)*(1-b),
  hardLight:(a,b)=>b<=.5?2*a*b:1-2*(1-a)*(1-b),
  softLight:(a,b)=>{if(b<=.5)return a-(1-2*b)*a*(1-a);const d=a<=.25?((16*a-12)*a+4)*a:Math.sqrt(a);return a+(2*b-1)*(d-a)},
  difference:(a,b)=>Math.abs(a-b),
  exclusion:(a,b)=>a+b-2*a*b,
};
const lum=c=>.3*c[0]+.59*c[1]+.11*c[2];
function clipColor(c){const l=lum(c),n=Math.min(...c),x=Math.max(...c);let o=c.slice();if(n<0)o=o.map(v=>l+(v-l)*l/(l-n));if(x>1)o=o.map(v=>l+(v-l)*(1-l)/(x-l));return o}
const setLum=(c,l)=>{const d=l-lum(c);return clipColor(c.map(v=>v+d))};
function blend(mode,base,top){
  const a=base.map(v=>v/255),b=top.map(v=>v/255);let o;
  if(mode==='color')o=setLum(b,lum(a));
  else if(mode==='luminosity')o=setLum(a,lum(b));
  else o=a.map((v,i)=>sep[mode](v,b[i]));
  return o.map(v=>C(v*255));
}
const b1=(mode,a,b)=>blend(mode,g3(a),g3(b))[0];

const MODES={
  multiply:{en:'Multiply',ko:'곱하기',neutral:'흰색',hint:'흰 줄 자리는 그대로이고 검은 줄 자리는 새까맣죠. 전체가 어두워지기만 하면 Multiply.'},
  screen:{en:'Screen',ko:'스크린',neutral:'검정',hint:'검은 줄 자리는 그대로, 흰 줄 자리는 새하얗습니다. 전체가 밝아지기만 하면 Screen.'},
  darken:{en:'Darken',ko:'어둡게 하기',neutral:'흰색',hint:'채널마다 더 어두운 값만 남겨요. 회색 줄 자리에서 밝은 색은 회색으로 눌리고 어두운 색은 그대로 남는 경계가 생깁니다.'},
  lighten:{en:'Lighten',ko:'밝게 하기',neutral:'검정',hint:'채널마다 더 밝은 값만 남겨요. 회색 줄 자리에서 어두운 부분이 회색으로 끌어올려진 평평한 경계가 보입니다.'},
  overlay:{en:'Overlay',ko:'오버레이',neutral:'50% 회색',hint:'회색 줄 자리가 거의 그대로이고, 검정·흰 줄 자리에선 대비가 세게 걸리면서 아래 밝기의 흔적이 남아요.'},
  difference:{en:'Difference',ko:'차이',neutral:'검정',hint:'흰 줄 자리가 반전(보색)되고 검은 줄 자리는 그대로예요. 반전이 보이면 Difference.'},
  colorBurn:{en:'Color Burn',ko:'색상 번',neutral:'흰색',hint:'Multiply보다 대비가 훨씬 세고 어두운 쪽이 빨리 뭉개집니다. 색 줄 자리 채도가 강하게 올라가요.'},
  linearDodge:{en:'Linear Dodge (Add)',ko:'선형 닷지(추가)',neutral:'검정',hint:'값을 그냥 더해요. 회색 줄 자리부터 이미 많은 부분이 하얗게 날아갑니다.'},
  luminosity:{en:'Luminosity',ko:'광도',neutral:'없음',hint:'결과에 아래 레이어의 색(색조·채도)이 전혀 없고 위 레이어의 밝기만 남아요.'},
  color:{en:'Color',ko:'색상',neutral:'없음',hint:'아래 레이어의 밝기 패턴은 남고 색은 위 레이어 것으로 바뀝니다.'},
  linearBurn:{en:'Linear Burn',ko:'선형 번',neutral:'흰색',hint:''},
  softLight:{en:'Soft Light',ko:'소프트 라이트',neutral:'50% 회색',hint:''},
  hardLight:{en:'Hard Light',ko:'하드 라이트',neutral:'50% 회색',hint:''},
  colorDodge:{en:'Color Dodge',ko:'색상 닷지',neutral:'검정',hint:''},
  exclusion:{en:'Exclusion',ko:'제외',neutral:'검정',hint:''},
};
const mName=m=>MODES[m].en;

/* ---------- 문제 빌더 ---------- */
function choice(prompt,visual,correct,wrongs,explain,extra={}){
  const options=shuffle([correct,...wrongs]);
  return Object.assign({type:'choice',prompt,visual,options,answer:options.indexOf(correct),explain},extra);
}
function numWrongs(correct,cands){
  const out=[],ok=v=>Math.abs(v-correct)>=8&&out.every(o=>Math.abs(o-v)>=8);
  for(const c of cands){const v=C(c);if(ok(v))out.push(v);if(out.length===3)break}
  let t=0;while(out.length<3&&t++<200){const v=C(correct+pick([-1,1])*R(14,80));if(ok(v))out.push(v)}
  return out;
}
const numQ=(prompt,visual,correct,cands,explain)=>choice(prompt,visual,{text:String(correct),mono:true},numWrongs(correct,cands).map(v=>({text:String(v),mono:true})),explain);

/* ---------- 비주얼 ---------- */
const H=s=>el=>{el.innerHTML=s};
const chips=c=>c.map((v,i)=>`<span class="chip"><i style="background:${CHC[i]}"></i>${CH[i]} ${v}</span>`).join('');
const sw=(c,label,show=true)=>`<div class="sw"><div style="background:${css(c)}"></div>${label?`<span>${label}</span>`:''}${show?`<b>${c[0]===c[1]&&c[1]===c[2]?c[0]:c.join(' · ')}</b>`:''}</div>`;
const calcVis=(a,b,mode)=>H(`${sw(g3(a),'아래 레이어')}<div class="op">${mode==='normal'?'모드 ?':mName(mode)}<b>→</b></div>${sw(g3(b),'위 레이어')}<div class="op">=<b>?</b></div>`);
const pairVis=(base,top,mode)=>H(`${sw(base,'아래')}<div class="op">${mode?mName(mode):''}<b>+</b></div>${sw(top,'위')}`);
const info=(c,t='정보 패널 · 회색 카드')=>`<div class="info"><span class="h">${t}</span><span style="color:var(--r)">R</span><span>${c[0]}</span><span style="color:var(--g)">G</span><span>${c[1]}</span><span style="color:var(--b)">B</span><span>${c[2]}</span></div>`;

function hsl(h,s,l){const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return[f(0)*255,f(8)*255,f(4)*255]}
function canvasFrom(w,h,fn,label){
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d'),im=ctx.createImageData(w,h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const c=fn(x,y),i=(y*w+x)*4;im.data[i]=c[0];im.data[i+1]=c[1];im.data[i+2]=c[2];im.data[i+3]=255}
  ctx.putImageData(im,0,0);const wrap=document.createElement('div');wrap.className='cv';wrap.appendChild(cv);
  if(label){const s=document.createElement('span');s.textContent=label;wrap.appendChild(s)}return wrap;
}
/* 모드 판별용: 아래=색상×밝기 맵, 위=검정/50%회색/흰색/색 네 줄 */
const MW=150,MH=104;
const basePx=(x,y)=>hsl(x/MW*360,.75,.86-y/MH*.72).map(C);
const stripePx=col=>(x)=>[[0,0,0],[128,128,128],[255,255,255],col][Math.min(3,Math.floor(x/MW*4))];
function modeVis(mode,col){return el=>{el.innerHTML='';const sp=stripePx(col);
  el.append(canvasFrom(MW,MH,basePx,'아래'),canvasFrom(MW,MH,(x)=>sp(x),'위: 검정 · 회색 · 흰색 · 색'),canvasFrom(MW,MH,(x,y)=>blend(mode,basePx(x,y),sp(x)),'결과'))}}
/* 색 캐스트 장면 */
const SW=230,SH=144;
function scenePx(x,y){
  if(x>78&&x<152&&y>54&&y<112){ if(x<83||x>147||y<59||y>107)return[240,240,240]; return[128,128,128]}
  if(x>160&&x<186&&y>70&&y<96)return[235,235,235];
  if(x>44&&x<70&&y>70&&y<96)return[22,22,22];
  if(y<SH*.55){const t=y/(SH*.55);return[110+t*95,160+t*65,225+t*20]}
  const t=(y-SH*.55)/(SH*.45);return[150-t*60,138-t*58,118-t*52];
}
const sceneEl=(card,label)=>{const k=card.map(v=>v/128);return canvasFrom(SW,SH,(x,y)=>scenePx(x,y).map((v,i)=>C(v*k[i])),label)};
const sceneVis=card=>el=>{el.innerHTML='';el.append(sceneEl(card,'가운데 = 원래 중립 회색이어야 할 카드'));el.insertAdjacentHTML('beforeend',info(card))};

const PRIM=[
 {c:[0,0,0],n:'검정'},{c:[255,0,0],n:'빨강'},{c:[0,255,0],n:'초록'},{c:[0,0,255],n:'파랑'},
 {c:[255,255,0],n:'노랑'},{c:[0,255,255],n:'시안'},{c:[255,0,255],n:'마젠타'},{c:[255,255,255],n:'흰색'}];
const LIGHT=['빨강','초록','파랑'];
const onText=c=>{const on=c.map((v,i)=>v?LIGHT[i]:null).filter(Boolean);return on.length?on.join(' + ')+' 빛':'켜진 빛 없음'};
const CASTS={
 red:{ko:'붉은 기',v:[1,0,0]},green:{ko:'초록 기',v:[0,1,0]},blue:{ko:'파란 기',v:[0,0,1]},
 cyan:{ko:'시안(청록) 기',v:[-1,0,0]},magenta:{ko:'마젠타(자주) 기',v:[0,-1,0]},yellow:{ko:'노란 기',v:[0,0,-1]}};
const CAST_KEYS=Object.keys(CASTS);
const FIX={red:'Red 커브 내리기',cyan:'Red 커브 올리기',green:'Green 커브 내리기',magenta:'Green 커브 올리기',blue:'Blue 커브 내리기',yellow:'Blue 커브 올리기'};
const SHIFT={'Red 올리기':'red','Red 내리기':'cyan','Green 올리기':'green','Green 내리기':'magenta','Blue 올리기':'blue','Blue 내리기':'yellow'};
const COMP={red:'cyan',green:'magenta',blue:'yellow',cyan:'red',magenta:'green',yellow:'blue'};
const castCol={red:[255,0,0],green:[0,255,0],blue:[0,0,255],cyan:[0,255,255],magenta:[255,0,255],yellow:[255,255,0]};
const castName={red:'빨강',green:'초록',blue:'파랑',cyan:'시안',magenta:'마젠타',yellow:'노랑'};
function castVals(k,n=128,d=R(16,30)){const v=CASTS[k].v,s=v.reduce((a,b)=>a+b,0),side=Math.round(d/3);return v.map(x=>x?n+x*d:n-s*side)}
const chanOf=k=>CASTS[k].v.findIndex(x=>x!==0);
function castExplain(k,c){const i=chanOf(k),hi=CASTS[k].v[i]>0;
  return hi?`${CH[i]}만 혼자 높아요 (${c[i]}). 한 채널이 튀면 그 채널 색이 끼어 있는 것 → <b>${CASTS[k].ko}</b>.`
           :`${CH[i]}만 혼자 낮아요 (${c[i]}). 한 채널이 모자라면 그 채널의 <b>반대색</b>이 보임 → ${CHN[i]}의 반대 = <b>${castName[k]}</b>.`}

const UNITS=[
{id:'u1',title:'빛의 덧셈',sub:'가산혼합 RGB',color:'#d94a4a',desc:'R·G·B 세 개의 빛을 섞어 색을 만든다',lessons:[
 {id:'l1',title:'세 채널 켜고 끄기',
  rule:{h:'RGB는 물감이 아니라 빛이다',items:['각 채널은 0(꺼짐)부터 255(완전히 켜짐)까지의 빛의 양.','빛은 더할수록 밝아진다. 빨강+초록 = <b>노랑</b>, 초록+파랑 = <b>시안</b>, 빨강+파랑 = <b>마젠타</b>.','셋 다 켜면 흰색, 셋 다 끄면 검정.']},
  gen(){const qs=[];sample(PRIM,3).forEach(p=>qs.push(choice('이 값은 어떤 색일까?',H(chips(p.c)),{color:p.c,text:p.n},sample(PRIM.filter(o=>o!==p),3).map(o=>({color:o.c,text:o.n})),`${onText(p.c)} → <b>${p.n}</b>. 빛은 더할수록 밝아져요.`)));
    sample(PRIM.filter(p=>p.n!=='검정'),3).forEach(p=>qs.push({type:'switch',prompt:`${p.n}을 만들어 보세요`,target:p.c,levels:[0,255],explain:`${p.n} = ${onText(p.c)}.`}));return shuffle(qs)}},
 {id:'l2',title:'중간값과 치우침',
  rule:{h:'세 값이 같으면 회색',items:['R = G = B 이면 어떤 숫자든 <b>무채색</b>(검정~회색~흰색).','128은 "반쯤 켜진 빛". 255,128,0 = 빨강 가득 + 초록 반 = <b>주황</b>.','한 채널만 튀면 그 색 기운, 한 채널만 모자라면 그 <b>반대색</b> 기운이 생긴다.']},
  gen(){const T=[{c:[255,128,0],n:'주황'},{c:[255,128,128],n:'분홍'},{c:[128,0,255],n:'보라'},{c:[128,128,128],n:'중간 회색'},{c:[0,128,255],n:'하늘색'},{c:[128,0,0],n:'어두운 빨강'},{c:[255,255,128],n:'연노랑'},{c:[128,255,0],n:'연두'}];
    const desc=c=>c.map((v,i)=>`${CH[i]} ${v===255?'가득':v===128?'반':'끔'}`).join(', ');
    const qs=sample(T,3).map(t=>({type:'switch',prompt:`${t.n}을 만들어 보세요`,showTarget:true,target:t.c,levels:[0,128,255],explain:`${t.n} = ${desc(t.c)}.`}));
    sample(CAST_KEYS,3).forEach(k=>{const c=castVals(k,R(110,170));qs.push(choice('이 회색은 어느 쪽으로 치우쳐 있을까?',H(chips(c)),{text:CASTS[k].ko},sample(CAST_KEYS.filter(o=>o!==k),3).map(o=>({text:CASTS[o].ko})),castExplain(k,c)))});
    const v=R(60,200);qs.push(choice('이 값은 어떤 색일까?',H(chips(g3(v))),{text:'치우침 없는 회색'},sample(CAST_KEYS,3).map(o=>({text:CASTS[o].ko})),`세 값이 모두 ${v}로 같아요 → 무채색 회색.`));
    return shuffle(qs)}},
 {id:'l3',title:'반대색(보색) 짝',

  gen(){const qs=[];
    sample(Object.keys(SHIFT),2).forEach(a=>{const k=SHIFT[a];qs.push(choice(`커브에서 <b>${a}</b>. 이미지 전체는 어느 쪽으로 기울까?`,null,{text:CASTS[k].ko},sample(CAST_KEYS.filter(o=>o!==k),3).map(o=>({text:CASTS[o].ko})),`${a.split(' ')[0]} 채널을 ${a.includes('올')?'올리면 그 색이 늘어나요':'내리면 그 반대색이 드러나요'} → <b>${CASTS[k].ko}</b>.`))});
    sample(CAST_KEYS,2).forEach(k=>qs.push(choice(`사진에 <b>${CASTS[k].ko}</b>가 돈다. 채널 하나만 만진다면?`,null,{text:FIX[k]},sample(Object.values(FIX).filter(f=>f!==FIX[k]),3).map(t=>({text:t})),`${CASTS[k].ko}의 반대 방향으로 움직여요 → <b>${FIX[k]}</b>.`)));
    sample(CAST_KEYS,2).forEach(k=>{const o=COMP[k];qs.push(choice(`<b>${castName[k]}</b>의 반대색은?`,H(sw(castCol[k],castName[k],false)),{color:castCol[o],text:castName[o]},sample(CAST_KEYS.filter(x=>x!==o&&x!==k),3).map(x=>({color:castCol[x],text:castName[x]})),`${castName[k]} + ${castName[o]} = 흰색. 세 채널을 꽉 채우는 짝이 반대색이에요.`))});
    return shuffle(qs)}},
]},
{id:'u2',title:'채널로 색 보정',sub:'커브와 정보 패널',color:'#d9a13a',desc:'눈 대신 숫자로 캐스트를 읽고 고친다',lessons:[

  gen(){const qs=sample(CAST_KEYS,4).map(k=>{const c=castVals(k);return choice('이 사진에는 어떤 캐스트가 있을까?',sceneVis(c),{text:CASTS[k].ko},sample(CAST_KEYS.filter(o=>o!==k),3).map(o=>({text:CASTS[o].ko})),castExplain(k,c))});

  gen(){const qs=sample(CAST_KEYS,3).map(k=>{const c=castVals(k);return choice('이 사진을 바로잡는 가장 직접적인 방법은?',sceneVis(c),{text:FIX[k]},sample(Object.values(FIX).filter(f=>f!==FIX[k]),3).map(t=>({text:t})),castExplain(k,c)+` 그래서 <b>${FIX[k]}</b>.`,{after:el=>{el.append(sceneEl(c,'전'),sceneEl([128,128,128],'후'))}})});
    sample(CAST_KEYS,3).forEach(k=>{const n=R(100,160),c=castVals(k,n),i=chanOf(k),tgt=c[(i+1)%3];
      qs.push(numQ(`회색 카드를 중립으로 만들려면 <b>${CHN[i]}</b> 커브에서 입력 ${c[i]}을 출력 몇으로?`,H(info(c)),tgt,[c[i],2*tgt-c[i],n,Math.round((c[0]+c[1]+c[2])/3)],`나머지 두 채널이 ${tgt}로 같아요. ${CH[i]}도 ${tgt}로 맞추면 R=G=B.`))});

]},
{id:'u3',title:'어둡게 그룹',sub:'Multiply · Darken · Burn',color:'#9c6bd6',desc:'흰색이 사라지는 모드들',lessons:[
 {id:'l6',title:'Multiply',neutral:[255,255,255],
  rule:{h:'Multiply = 두 값을 곱한다',formula:'결과 = 아래 × 위 ÷ 255',items:['0~1로 보면 그냥 곱셈. 1(흰색)을 곱하면 그대로, 0(검정)을 곱하면 0.','1보다 작은 수끼리 곱하니까 결과는 <b>항상 둘 중 어두운 쪽 이하</b>.','채널별로 따로 계산한다.']},
  gen(){const qs=[];for(let i=0;i<3;i++){const a=R5(80,250),b=R5(60,240),r=b1('multiply',a,b);qs.push(numQ('Multiply 결과는?',calcVis(a,b,'multiply'),r,[Math.min(a,b),b1('linearBurn',a,b),b1('screen',a,b),(a+b)/2],`<span class="formula">${a} × ${b} ÷ 255 ≈ ${r}</span><br>둘 중 어두운 ${Math.min(a,b)}보다도 어두워졌죠.`))}

const ALL=UNITS.flatMap(u=>u.lessons.map(l=>({...l,unit:u})));

/* ---------- 저장 ---------- */
const KEY='chromashift-lessons-v1';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
let S={done:{},xp:0,streak:0,last:null,dayXp:0,day:null};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)S=Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function streakNow(){if(!S.last)return 0;const y=new Date();y.setDate(y.getDate()-1);const yd=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();return(S.last===today()||S.last===yd)?S.streak:0}
const GOAL=30;
const dayXp=()=>S.day===today()?S.dayXp:0;

/* ---------- 홈 ---------- */
const app=document.getElementById('app');
const ICON={done:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5.5v13l10.5-6.5z"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="#7a7a7a"><path d="M7 10V8a5 5 0 0110 0v2h1a1 1 0 011 1v9a1 1 0 01-1 1H6a1 1 0 01-1-1v-9a1 1 0 011-1zm2 0h6V8a3 3 0 00-6 0z"/></svg>'};
function topBar(){const st=streakNow();return `<div class="top"><div class="brand"><i><b style="background:var(--r)"></b><b style="background:var(--g)"></b><b style="background:var(--b)"></b></i>ChromaShift</div>
  <span class="stat" title="연속 학습일"><span class="flame ${st?'':'off'}"></span>${st}</span><span class="stat" title="총 XP"><span class="gem"></span>${S.xp}</span></div>`}
function home(){
  const cur=ALL.findIndex(l=>!S.done[l.id]);let idx=0;
  const anyDone=Object.keys(S.done).length>0;
  let h=topBar()+`<div class="goal"><div><b>오늘의 목표</b> <small class="mono">${Math.min(dayXp(),GOAL)} / ${GOAL} XP</small></div>
   <button class="practice" id="prac" ${anyDone?'':'disabled'}>빠른 복습</button><div class="bar"><span style="width:${Math.min(100,dayXp()/GOAL*100)}%"></span></div></div>`;
  UNITS.forEach((u,ui)=>{
    h+=`<section class="unit" style="--uc:${u.color}"><div class="unit-head"><small>UNIT ${ui+1} · ${u.sub}</small><h2>${u.title}</h2><p>${u.desc}</p></div><div class="path">`;
    u.lessons.forEach(l=>{const i=idx++;const st=S.done[l.id]?'done':i===cur?'current':'locked';const off=Math.round(Math.sin(i*1.25)*70);
      h+=`<div class="node-wrap ${st}" style="transform:translateX(${off}px)">${st==='current'?'<span class="bubble">시작</span>':''}
      <button class="node ${st}" data-l="${l.id}" aria-label="${l.title}" ${st==='locked'?'aria-disabled="true"':''}>${ICON[st==='done'?'done':st==='current'?'play':'lock']}</button><span class="node-label">${l.title}</span></div>`});
    h+='</div></section>'});
  h+=`<p class="foot">한 레슨 약 2분 · 틀린 문제는 레슨 끝에 다시 나와요<br>문제는 매번 새로 만들어져서 반복해도 같은 숫자가 안 나와요</p>`;
  app.innerHTML=h;
  app.querySelectorAll('.node').forEach(b=>b.onclick=()=>{if(b.classList.contains('locked'))return;startLesson(ALL.find(l=>l.id===b.dataset.l))});
  const p=document.getElementById('prac');if(p)p.onclick=()=>{const pool=ALL.filter(l=>S.done[l.id]);const qs=shuffle(pool.flatMap(l=>sample(l.gen(),2))).slice(0,8);startLesson({id:'practice',title:'빠른 복습',unit:{color:'#4ea4ff'}},qs)};
  const c=app.querySelector('.node-wrap.current');if(c)c.scrollIntoView({block:'center'});
}

/* ---------- 레슨 ---------- */
let L=null;
function startLesson(lesson,qs){
  L={lesson,queue:qs||lesson.gen(),total:0,solved:0,first:0,wrong:0,showRule:!qs&&!!lesson.rule};
  L.total=L.queue.length;window.scrollTo(0,0);renderStep();
}
function shell(inner,dock){
  app.innerHTML=`<div class="lesson"><div class="lhead"><button class="x" id="quit" aria-label="레슨 나가기">×</button><div class="prog"><span style="width:${L.solved/L.total*100}%"></span></div></div>
  <div class="qbody">${inner}</div><div class="dock" id="dock">${dock}</div></div>`;
  document.getElementById('quit').onclick=home;
}
function renderStep(){
  if(L.showRule){const r=L.lesson.rule;
    shell(`<span class="tag">새 규칙</span><div class="rule"><h3>${r.h}</h3>${r.formula?`<span class="formula" style="white-space:pre-wrap">${r.formula}</span>`:''}<ul>${r.items.map(i=>`<li>${i}</li>`).join('')}</ul>
      ${L.lesson.neutral?`<div class="neutral"><i style="background:${css(L.lesson.neutral)}"></i>중립색 (칠해도 변화 없는 색)</div>`:''}</div>`,`<button class="cta" id="go">알겠어요, 풀어볼게요</button>`);
    document.getElementById('go').onclick=()=>{L.showRule=false;renderStep()};return}
  if(!L.queue.length)return finish();
  const q=L.queue[0];
  shell(`<span class="tag">${L.lesson.title}</span>${q.retry?'<span class="retry">다시 풀기</span>':''}<div class="prompt">${q.prompt}</div><div class="visual" id="vis"></div><div id="ans"></div>`,
    `<button class="cta" id="check" disabled>확인</button>`);
  const vis=document.getElementById('vis');if(q.visual)q.visual(vis);else vis.remove();
  const ans=document.getElementById('ans'),check=document.getElementById('check');
  if(q.type==='choice'){
    const swatchy=q.options.some(o=>o.color);
    ans.innerHTML=`<div class="opts ${swatchy||q.options.every(o=>o.mono)?'grid':''}">${q.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${i+1}</span>${o.color?`<span class="s" style="background:${css(o.color)}"></span>`:''}<span class="${o.mono?'mono':''}">${o.text||''}</span></button>`).join('')}</div>`;
    let sel=-1;const bs=[...ans.querySelectorAll('.opt')];
    const choose=i=>{sel=i;bs.forEach((b,j)=>b.classList.toggle('sel',j===i));check.disabled=false};
    bs.forEach((b,i)=>b.onclick=()=>choose(i));
    L.key=e=>{if(e.key>='1'&&e.key<=String(bs.length)&&!bs[0].disabled)choose(+e.key-1);else if(e.key==='Enter'&&!check.disabled)check.click()};
    check.onclick=()=>{const ok=sel===q.answer;bs.forEach(b=>b.disabled=true);bs[q.answer].classList.add('right');if(!ok)bs[sel].classList.add('wrong');bs[sel].classList.remove('sel');
      const o=q.options[q.answer];grade(ok,q,(o.color?`<span class="s" style="display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;background:${css(o.color)}"></span> `:'')+(o.text||''))};
  } else if(q.type==='switch'){
    const cur=[0,0,0];
    ans.innerHTML=`<div class="visual" style="margin-bottom:14px">${sw(q.target,'목표',false)}<div class="op"><b>→</b></div><div class="sw"><div id="live" style="background:#000"></div><span>내가 만든 색</span><b id="liveV">0 · 0 · 0</b></div></div>
      <div class="mixer">${[0,1,2].map(c=>`<div class="mix-row"><b style="color:${CHC[c]}">${CH[c]}</b><div class="lv" style="--cc:${CHC[c]}">${q.levels.map(v=>`<button data-c="${c}" data-v="${v}" class="${v===0?'on':''}">${q.levels.length===2?(v?'켜기 255':'끄기 0'):v}</button>`).join('')}</div></div>`).join('')}</div>`;
    const live=document.getElementById('live'),liveV=document.getElementById('liveV');
    ans.querySelectorAll('.lv button').forEach(b=>b.onclick=()=>{const c=+b.dataset.c;cur[c]=+b.dataset.v;b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));live.style.background=css(cur);liveV.textContent=cur.join(' · ');check.disabled=false});
    L.key=e=>{if(e.key==='Enter'&&!check.disabled)check.click()};
    check.onclick=()=>{ans.querySelectorAll('.lv button').forEach(b=>b.disabled=true);const ok=cur.every((v,i)=>v===q.target[i]);grade(ok,q,q.target.join(' · '))};
  }
}
function grade(ok,q,ansText){
  if(ok){L.solved++;if(!q.retry)L.first++;L.queue.shift()}
  else{L.wrong++;L.queue.shift();L.queue.push(Object.assign({},q,{retry:true,options:q.options}))}
  const dock=document.getElementById('dock');
  dock.innerHTML=`<div class="fb ${ok?'ok':'bad'}"><h3>${ok?pick(['정확해요','맞아요','계산 그대로예요']):'다시 생각해 봐요'}</h3>${ok?'':`<p>정답: <span class="ans">${ansText}</span></p>`}<p>${q.explain}</p>${q.after?'<div class="after" id="after"></div>':''}</div>
   <button class="cta ${ok?'ok':'bad'}" id="next">계속</button>`;
  if(q.after)q.after(document.getElementById('after'));
  const nx=document.getElementById('next');nx.focus({preventScroll:true});nx.onclick=renderStep;
  L.key=e=>{if(e.key==='Enter'){e.preventDefault();nx.click()}};
  document.querySelector('.prog span').style.width=(L.solved/L.total*100)+'%';
  dock.scrollIntoView({block:'end'});
}
function finish(){
  const gained=10+L.first*2;
  if(L.lesson.id!=='practice')S.done[L.lesson.id]=true;
  S.xp+=gained;if(S.day!==today()){S.day=today();S.dayXp=0}S.dayXp+=gained;
  const st=streakNow();if(S.last!==today()){S.streak=st+1;S.last=today()}save();
  const acc=Math.round(L.first/L.total*100);
  app.innerHTML=topBar()+`<div class="done-screen"><div class="rgbburst"><span style="background:var(--r)"></span><span style="background:var(--g)"></span><span style="background:var(--b)"></span></div>
   <h2>${L.lesson.title} 완료</h2>
   <div class="tiles"><div class="tile" style="border-color:var(--accent)"><small>획득 XP</small><b>+${gained}</b></div><div class="tile" style="border-color:var(--ok)"><small>첫 시도 정답률</small><b>${acc}%</b></div><div class="tile" style="border-color:#ff9b3d"><small>연속 학습</small><b>${S.streak}일</b></div></div>
   ${L.wrong?`<p style="color:var(--muted);margin:0">틀렸던 ${L.wrong}문제는 다시 풀어서 넘어왔어요.</p>`:''}
   <button class="cta" id="home" style="max-width:360px">계속하기</button>
   ${L.lesson.gen&&L.lesson.id!=='practice'?'<button class="practice" id="again">같은 레슨 새 문제로 다시</button>':''}</div>`;
  document.getElementById('home').onclick=home;
  const a=document.getElementById('again');if(a)a.onclick=()=>startLesson(L.lesson);
  L.key=e=>{if(e.key==='Enter')home()};
}
document.addEventListener('keydown',e=>{if(L&&L.key&&document.querySelector('.lesson,.done-screen'))L.key(e)});
window.__ALL=ALL;
home();
</script>
